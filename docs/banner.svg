<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Chute — shoot files between your Mac and your VPS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- logo mark: a file dropping down the chute into an inbox tray -->
  <g transform="translate(88,138)">
    <rect x="0" y="0" width="84" height="84" rx="20" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.10"/>
    <line x1="42" y1="18" x2="42" y2="46" stroke="#3fb950" stroke-width="6" stroke-linecap="round"/>
    <polyline points="30,36 42,50 54,36" fill="none" stroke="#3fb950" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M24,54 L24,66 L60,66 L60,54" fill="none" stroke="#c9d1d9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark + taglines -->
  <text x="196" y="176" font-family="-apple-system, 'SF Pro Display', Helvetica, Arial, sans-serif"
        font-size="74" font-weight="700" fill="#ffffff" letter-spacing="0.5">Chute</text>
  <text x="198" y="214" font-family="-apple-system, Helvetica, Arial, sans-serif"
        font-size="22" fill="#c9d1d9">Shoot files between your Mac and your VPS.</text>
  <text x="200" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14.5" fill="#8b949e" letter-spacing="2">single binary · zero deps · ssh + rsync · macOS + Linux</text>

  <!-- terminal card -->
  <g>
    <rect x="648" y="64" width="560" height="232" rx="14" fill="#0b0f14" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="676" cy="90" r="6" fill="#ff5f57"/>
    <circle cx="700" cy="90" r="6" fill="#febc2e"/>
    <circle cx="724" cy="90" r="6" fill="#28c840"/>
    <text x="928" y="95" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#6e7681" letter-spacing="1">chute</text>
    <line x1="648" y1="112" x2="1208" y2="112" stroke="#ffffff" stroke-opacity="0.06"/>

    <text x="676" y="154" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> chute push report.pdf</tspan>
    </text>
    <text x="676" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <tspan fill="#58a6ff">↑</tspan><tspan fill="#8b949e"> report.pdf → </tspan><tspan fill="#e6edf3">remote-box:~/inbox</tspan><tspan fill="#3fb950">  ✓</tspan>
    </text>
    <text x="676" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <tspan fill="#6e7681">~/inbox/report.pdf</tspan><tspan fill="#3fb950">   (copied to clipboard)</tspan>
    </text>
    <text x="676" y="280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <tspan fill="#3fb950">$</tspan>
    </text>
    <rect x="692" y="266" width="10" height="18" fill="#3fb950" opacity="0.9"/>
  </g>
</svg>
